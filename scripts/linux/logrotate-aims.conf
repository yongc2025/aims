# =============================================================================
# AIMS logrotate 配置
# =============================================================================
# 仅当使用 start-aims.sh 脚本启动时需要（systemd 模式改用 journald）
# 使用方法:
#   sudo cp scripts/linux/logrotate-aims.conf /etc/logrotate.d/aims
#   测试: sudo logrotate -d /etc/logrotate.d/aims
# =============================================================================

/home/ubuntu/projects/aims/logs/*.log {
    # 每天轮替一次
    daily
    # 保留最近 14 天的日志
    rotate 14
    # 日志文件超过 10MB 也会触发轮替
    size 10M
    # 不立即压缩，等下次 logrotate 再压缩旧文件
    delaycompress
    # 压缩旧日志（.gz）
    compress
    # 缺失日志文件不报错
    missingok
    # 日志文件不存在时继续执行
    notifempty
    # 轮替后创建新的空日志文件
    create 0644 ubuntu ubuntu
    # 轮替后执行的命令（重启 AIMS 或发信号让进程重新打开文件描述符）
    postrotate
        # 如果 aims.service 在用，告诉它重新打开日志
        systemctl kill -s HUP aims 2>/dev/null || true
        # 如果是脚本启动的，找到 uvicorn 进程发 HUP 信号
        # pgrep -f "uvicorn backend.main" | xargs -r kill -HUP 2>/dev/null || true
    endscript
}
