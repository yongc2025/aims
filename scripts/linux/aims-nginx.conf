# =============================================================================
# AIMS Nginx 反向代理配置模板
# =============================================================================
# 使用方法:
#   1. 将本文件复制到 /etc/nginx/sites-available/aims
#   2. 修改 server_name 为你的域名
#   3. 配置 SSL 证书路径（或先去掉 SSL 相关行用 HTTP 测试）
#   4. 设置 basic auth 用户名密码:
#      sudo apt install apache2-utils
#      sudo htpasswd -c /etc/nginx/.htpasswd aims
#   5. 启用站点: sudo ln -s /etc/nginx/sites-available/aims /etc/nginx/sites-enabled/
#   6. 测试: sudo nginx -t
#   7. 重载: sudo systemctl reload nginx
# =============================================================================

server {
    listen 80;
    server_name your-domain.com;   # ← 改为你的域名或服务器 IP

    # ── 申请 Let's Encrypt 证书时 ACME 验证用 ──
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ── 其余 HTTP 请求重定向到 HTTPS ──
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;   # ← 改为你的域名

    # ── SSL 证书（用 certbot 申请） ──
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── 基础认证（可选，建议开启） ──
    # 生成密码: sudo htpasswd -c /etc/nginx/.htpasswd aims
    # auth_basic           "AIMS - 请输入用户名密码";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # ── 静态资源缓存 ──
    location ~ ^/assets/ {
        proxy_pass http://127.0.0.1:18765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── API 与页面 ──
    location / {
        proxy_pass http://127.0.0.1:18765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（保留以备将来使用）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # ── 日志 ──
    access_log /var/log/nginx/aims-access.log;
    error_log  /var/log/nginx/aims-error.log;
}
